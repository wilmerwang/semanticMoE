[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticMoE"
version = "0.1.0"
description = "Standalone RECAP semantic MoE brain-age inference"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.24", "pandas>=2.0"]

[tool.setuptools]
packages = ["semanticMoE", "semanticMoE.comps"]
package-dir = {semanticMoE = "."}

[tool.setuptools.package-data]
semanticMoE = ["assets/*", "checkpoints/*.pt", "examples/*.npy", "README.md"]
